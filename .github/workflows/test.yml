# The smoke test on every Neovim the plugin supports — 0.9 is where the
# comment editor falls back to a split and vim.system doesn't exist — on
# both platforms people run it on.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: nvim ${{ matrix.nvim }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        nvim: [v0.9.5, v0.10.4, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - run: nvim --version
      - run: sh tests/run.sh
